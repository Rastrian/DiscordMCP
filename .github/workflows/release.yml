name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Test
        run: PYTHONPATH=src uv run pytest -q

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src

      - name: Verify tag matches package version
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/discord_mcp_platform/_version.py)"
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read __version__ from src/discord_mcp_platform/_version.py"
            exit 1
          fi
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package version ${VERSION}."
            echo "::error::Bump src/discord_mcp_platform/_version.py, run 'uv lock', commit, then tag v${VERSION}."
            exit 1
          fi
          echo "Releasing ${VERSION}"

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action derives org.opencontainers.image.version (+ revision, source, ...)
      # from the semver tag automatically.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rastrian/discord-mcp-platform
          # Pre-release tags (e.g. v1.2.3-rc1) only get the full version tag,
          # never the rolling major.minor or latest tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
