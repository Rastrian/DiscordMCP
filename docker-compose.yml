# Production-like stack: runs the packaged app from the image (no code mounts,
# no reload). Docker Compose merges docker-compose.override.yml automatically
# when present, which re-enables source mounts and --reload for development.
# For a production-like run without the dev overrides:
#   docker compose -f docker-compose.yml up --build
services:
  api:
    build: .
    container_name: discord-mcp-platform-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: discord-mcp-platform-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discord_mcp_platform
    ports:
      - "5432:5432"
    volumes:
      - discord_mcp_platform_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: discord-mcp-platform-redis
    ports:
      - "6379:6379"

volumes:
  discord_mcp_platform_pgdata:
